[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsp-dokuwiki-converter"
version = "0.1.7"
description = "Convert selected QSP Foundation Markdown and MDX pages to DokuWiki."
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
]

[project.scripts]
qsp-dokuwiki = "qspdocuwiki.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qspdocuwiki*"]
